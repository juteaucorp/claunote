# Tests à chaque PR et à chaque push sur main : site/worker (pytest) et service Pronote (node --test).
name: Tests
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    # Vraie base jetable : la séparation des données par compte (row-level security) y est testée
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: claunote, POSTGRES_PASSWORD: test, POSTGRES_DB: claunote_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claunote" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLAUNOTE_TEST_DB: postgresql://claunote:test@localhost:5432/claunote_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements.txt
      # Mêmes bibliothèques système que l'image : WeasyPrint (PDF), poppler et Tesseract (lecture locale), Graphviz (schémas)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils tesseract-ocr tesseract-ocr-fra catdoc graphviz fonts-dejavu-core
      - run: pip install -r requirements.txt pytest
        working-directory: app
      - run: python -m pytest -q
        working-directory: app
  pronote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: pronote/package-lock.json
      - run: npm ci && npm test
        working-directory: pronote
  maintenance:
    # Worker Cloudflare de la page de maintenance (infra/maintenance) : erreurs du tunnel remplacées, le reste intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test
        working-directory: infra/maintenance
