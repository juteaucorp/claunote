services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data   # disque local de la VM, jamais sur kDrive
    healthcheck:   # web et worker attendent que la base accepte les connexions (démarrage de la VM)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"   # IP de la VM sur ton VPN, jamais 0.0.0.0
    volumes:
      - caddy:/caddy:ro   # certificat racine à installer sur l'iPhone (page /installer)
    depends_on:
      db: {condition: service_healthy}
      pronote: {condition: service_started}

  caddy:
    # HTTPS pour l'appli iPhone et les notifications (voir infra/SETUP.md, section 13)
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CLAUNOTE_HOTE: ${CLAUNOTE_HOTE:-localhost}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data      # autorité de certification locale : à garder
    depends_on: [web]

  worker:
    build: ./app
    restart: unless-stopped
    command: python -m claunote.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      CACHE_DIR: /cache
    volumes:
      - cache:/cache   # copies locales des scans en cours de traitement
    # À une mise à jour, le worker finit le document en cours avant de s'arrêter (sinon, il est refait)
    stop_grace_period: 2m
    depends_on:
      db: {condition: service_healthy}
      pronote: {condition: service_started}

  pronote:
    build: ./pronote
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
    volumes:
      - pronote:/data   # jeton de reconnexion Pronote (jamais le mot de passe)
    # pas de port publié : seuls web et worker lui parlent, sur le réseau Docker

volumes:
  pgdata:
  cache:
  pronote:
  caddy:
