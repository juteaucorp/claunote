services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data   # disque local de la VM, jamais sur kDrive
    healthcheck:   # web et worker attendent que la base accepte les connexions (démarrage de la VM)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./app
    restart: unless-stopped
    # Sécurité : aucun privilège système (même root, il ne peut ni changer de droits ni en gagner)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"   # IP de la VM sur ton VPN, jamais 0.0.0.0
    volumes:
      - caddy:/caddy:ro   # certificat racine à installer sur l'iPhone (page /installer)
      - maj:/maj          # demandes de mise à jour, lues par le service maj
      - secrets:/secrets  # clé qui chiffre les secrets réglés sur le site (jamais dans la base)
      - tunnel:/tunnel    # jeton du tunnel Cloudflare réglé sur le site, lu par cloudflared
      - ${FICHIERS_HOTE:-fichiers}:/fichiers   # fichiers sur la VM (STOCKAGE local ou les_deux) : Inbox, Etudes
    depends_on:
      db: {condition: service_healthy}
      pronote: {condition: service_started}

  caddy:
    # HTTPS pour l'appli iPhone et les notifications (voir infra/SETUP.md, section 13)
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      CLAUNOTE_HOTE: ${CLAUNOTE_HOTE:-localhost}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data      # autorité de certification locale : à garder
    depends_on: [web]

  cloudflared:
    # Accès par Internet sans ouvrir de port (infra/SETUP.md, section 17) : la VM appelle Cloudflare, pas l'inverse.
    # Ne démarre que si COMPOSE_PROFILES=tunnel dans .env. Seuls les appareils approuvés passent (appareils.py).
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    command: tunnel --no-autoupdate run
    environment:
      # Jeton du tunnel : celui du .env s'il y en a un (prioritaire), sinon celui réglé sur le site
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_TOKEN_FILE: /tunnel/token
    volumes:
      - tunnel:/tunnel:ro
    depends_on: [web]
    # pas de port publié : il joint web:8000 sur le réseau Docker

  worker:
    build: ./app
    restart: unless-stopped
    cpu_shares: 512    # priorité : le site et la base passent avant le travail de fond (1024 par défaut)
    command: python -m claunote.worker
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      CACHE_DIR: /cache
    volumes:
      - cache:/cache   # copies locales des scans en cours de traitement
      - secrets:/secrets   # clé qui déchiffre les secrets réglés sur le site
      - ${FICHIERS_HOTE:-fichiers}:/fichiers
    # À une mise à jour, le worker finit le document en cours avant de s'arrêter (sinon, il est refait)
    stop_grace_period: 2m
    depends_on:
      db: {condition: service_healthy}
      pronote: {condition: service_started}

  ollama:
    # Modèle local (« local d'abord ») : petit modèle de langue sur le processeur, pas de carte graphique.
    # Les modèles se téléchargent tout seuls au premier lancement (~2,3 Go). Pour s'en passer :
    # Analyses → « Éteindre les modèles locaux » sur le site (arrête ollama et lecture, tout passe par Claude).
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    cpu_shares: 256    # priorité basse : il prend le processeur libre, pas celui du site
    environment:
      # Mémoire : 2 réponses en même temps au plus (le fond + une question du chat) au lieu de 4 par défaut,
      # chacune avec ~300 Mo de contexte réservé : ~600 Mo de moins pour qwen2.5:3b
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 2
      # Contexte compressé (q8_0, moitié moins) quand la version d'Ollama le permet sur processeur ; sinon ignoré
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama:/root/.ollama   # modèles téléchargés
    # pas de port publié : seuls web et worker lui parlent, sur le réseau Docker

  lecture:
    # Petits modèles sur le processeur : PDF lus avec leurs tableaux (Docling), photo d'une formule → LaTeX
    # (pix2tex), meilleurs passages en tête pour le chat (FlashRank). Facultatif : sans lui, tout marche
    # comme avant. ~1,5 Go de mémoire quand tout est chargé, rendue après 10 min sans usage.
    # Pour s'en passer : Analyses → « Éteindre les modèles locaux » sur le site.
    build: ./lecture
    restart: unless-stopped
    cpu_shares: 256    # priorité basse, comme Ollama
    environment:
      LECTURE_THREADS: ${LECTURE_THREADS:-2}   # cœurs utilisés par calcul
      LECTURE_GARDER_MIN: ${LECTURE_GARDER_MIN:-10}   # un modèle inutilisé depuis 10 min est déchargé
    volumes:
      - lecture:/modeles   # modèles téléchargés au premier usage
    # pas de port publié : seuls web et worker lui parlent, sur le réseau Docker

  pronote:
    build: ./pronote
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      NODE_OPTIONS: --max-old-space-size=256   # Node garde sinon jusqu'à 2 Go avant de faire le ménage
    volumes:
      - pronote:/data   # jeton de reconnexion Pronote (jamais le mot de passe)
    # pas de port publié : seuls web et worker lui parlent, sur le réseau Docker

  maj:
    # Mise à jour depuis le site (Réglages → Mise à jour) : git pull puis reconstruction des services.
    # Il pilote Docker : il ne fait que les 4 actions de infra/maj/boucle.sh, jamais une commande du site.
    # Le dépôt est monté au même chemin que sur la VM, pour que Compose y retrouve ses fichiers.
    # La version réellement en service de chaque service est notée dans le volume maj (construit/) :
    # c'est elle qui décide quoi reconstruire, pas seulement ce que le dernier git pull a apporté.
    build: ./infra/maj
    restart: unless-stopped
    environment:
      DEPOT: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
      - maj:/maj

volumes:
  secrets:   # clé de chiffrement des réglages : à sauvegarder avec la base (sans elle, les secrets sont à refaire)
  tunnel:
  fichiers:  # fichiers sur la VM ; FICHIERS_HOTE=/chemin/sur/la/vm pour les mettre sur un autre disque
  lecture:
  maj:
  ollama:
  pgdata:
  cache:
  pronote:
  caddy:
