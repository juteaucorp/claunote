<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}Claunote{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
  :root { --fond: #fafaf8; --carte: #fff; --texte: #1d1d1b; --doux: #6b6b66; --bord: #e2e1dc; --accent: #2f6fde; --alerte: #b54708; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #171716; --carte: #21211f; --texte: #ecebe6; --doux: #a3a29c; --bord: #353531; --accent: #7aa7ff; --alerte: #f5a35c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 system-ui, sans-serif; background: var(--fond); color: var(--texte); }
  header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--bord); background: var(--carte); }
  header a { color: var(--texte); text-decoration: none; font-weight: 500; }
  header .logo { font-weight: 700; margin-right: auto; }
  header form { display: flex; gap: 6px; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--accent); }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 14px 16px; margin: 10px 0; }
  .doux { color: var(--doux); font-size: .9rem; }
  .alerte { color: var(--alerte); }
  input, select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--bord); border-radius: 6px; background: var(--carte); color: var(--texte); }
  button { cursor: pointer; }
  button.principal { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .pastilles a { display: inline-block; margin: 4px 6px 0 0; padding: 2px 10px; border: 1px solid var(--bord); border-radius: 999px; text-decoration: none; font-size: .9rem; }
  .transcription { overflow-wrap: anywhere; }
  .transcription pre { overflow-x: auto; }
  iframe { width: 100%; height: 70vh; border: 1px solid var(--bord); border-radius: 8px; background: #fff; }
  mark, b { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">Claunote</a>
  <a href="/">Bibliothèque</a>
  <a href="/a-verifier">À vérifier</a>
  <form action="/recherche"><input name="q" placeholder="Rechercher…" value="{{ q|default('') }}" aria-label="Rechercher"></form>
  <button hx-post="/scan" hx-target="#retour-scan" hx-swap="innerHTML">Scanner maintenant</button>
</header>
<main>
  <p id="retour-scan" class="doux"></p>
  {% block contenu %}{% endblock %}
</main>
</body>
</html>
