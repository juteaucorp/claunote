{# Cours rattaché, FACULTATIF : la matière suffit. Replié par défaut ; ne propose que les cours de la matière
   choisie, sans doublons (même titre = un seul), les plus récents d'abord. #}
{% set liste = cours_matiere | default([]) %}
{% if liste or cours %}
{% if cours %}<label class="puce" title="Cours rattaché">📎 {% else %}<details class="lier-cours">
  <summary>📎 Lier un cours <span class="facultatif">(facultatif)</span></summary>{% endif %}
  <select name="document_id" aria-label="Cours rattaché (facultatif)">
    <option value="">Aucun cours</option>
    {% if cours and cours.id not in liste|map(attribute='id')|list %}<option value="{{ cours.id }}" selected>{{ cours.titre or cours.nom }}</option>{% endif %}
    {% for d in liste %}<option value="{{ d.id }}" {{ 'selected' if d.id == choisi or (cours and d.id == cours.id) }}>{{ d.titre or d.nom }}{% if moi_id and d.compte_id != moi_id %} · partagé{% endif %}</option>{% endfor %}
  </select>
{% if cours %}</label>{% else %}</details>{% endif %}
{% else %}<input type="hidden" name="document_id" value="">{% endif %}
